name: Apply concurrent chat ownership fix

on:
  push:
    branches:
      - hotfix/group-invite-ack-stall
    paths:
      - .github/workflows/audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/group-invite-ack-stall
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch chat ownership
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web/src/main.tsx")
          text = path.read_text(encoding="utf-8")

          old = (
              "  useEffect(() => {\n"
              "    if (!currentUser) return;\n"
              "    let alive = true;\n"
              "    void Promise.all([loadLocalGroups(), api.turnCredentials(token)])\n"
              "      .then(([groups, { iceServers }]) => { if (alive) return backgroundChats.sync(groups, currentUser.displayName, iceServers, activeChannel?.id); })\n"
              "      .catch(() => undefined);\n"
              "    return () => { alive = false; };\n"
              "  }, [activeChannel?.id, currentUser, communities, token]);"
          )
          new = (
              "  useEffect(() => {\n"
              "    if (!currentUser) return;\n"
              "    let alive = true;\n"
              "    const reservedChannelIds = roomId && callContext?.textChannelId ? [callContext.textChannelId] : [];\n"
              "    void Promise.all([loadLocalGroups(), api.turnCredentials(token)])\n"
              "      .then(([groups, { iceServers }]) => { if (alive) return backgroundChats.sync(groups, currentUser.displayName, iceServers, activeChannel?.id, reservedChannelIds); })\n"
              "      .catch(() => undefined);\n"
              "    return () => { alive = false; };\n"
              "  }, [activeChannel?.id, callContext?.textChannelId, currentUser, communities, roomId, token]);"
          )
          if old not in text:
              raise SystemExit("background chat sync block not found")
          text = text.replace(old, new, 1)

          old = "      const textChannel = availableChannels.find((item) => item.kind === \"text\") ?? null;\n      setCallContext({"
          new = (
              "      const textChannel = availableChannels.find((item) => item.kind === \"text\") ?? null;\n"
              "      if (textChannel) {\n"
              "        await backgroundChats.release(textChannel.id);\n"
              "        if (!activeFriend && activeChannel?.id === textChannel.id) {\n"
              "          await chat.disconnect().catch(() => undefined);\n"
              "          setChatStatus(\"disconnected\");\n"
              "        }\n"
              "      }\n"
              "      setCallContext({"
          )
          if old not in text:
              raise SystemExit("enterVoice text channel block not found")
          text = text.replace(old, new, 1)

          old = "      if (!activeChannel || activeChannel.kind !== \"text\") return;\n      const [identity, groups] = await Promise.all(["
          new = (
              "      if (!activeChannel || activeChannel.kind !== \"text\") return;\n"
              "      if (roomId && callContext?.textChannelId === activeChannel.id) {\n"
              "        throw new Error(\"Este canal já pertence ao chat automático da chamada enquanto você estiver na sala de voz.\");\n"
              "      }\n"
              "      const [identity, groups] = await Promise.all(["
          )
          if old not in text:
              raise SystemExit("group connect block not found")
          text = text.replace(old, new, 1)

          old = "      await Promise.all([chat.disconnect(), callChat.disconnect()]);"
          new = "      await Promise.all([chat.disconnect(), callChat.disconnect(), backgroundChats.disconnect()]);"
          if old not in text:
              raise SystemExit("logout disconnect block not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git diff --cached --check
          git commit -m "fix(chat): isolate call chat from foreground sessions"
          git push origin HEAD:hotfix/group-invite-ack-stall
