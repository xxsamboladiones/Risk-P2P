name: Windows gamepad verification
on:
  push:
    branches: [feat/game-mode-remote-input]

jobs:
  windows-gamepad:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy desktop backend
        run: cargo clippy --manifest-path desktop-backend/Cargo.toml --all-targets -- -D warnings
      - name: Run desktop backend tests
        run: cargo test --manifest-path desktop-backend/Cargo.toml
