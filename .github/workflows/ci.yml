name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-migration-integrity.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - run: pnpm verify:turn-config
      - name: Build desktop Rust sidecar
        run: pnpm build:backend:desktop
      - name: Validate Electron bundle with sidecar
        run: |
          pnpm --filter @risk/desktop exec tsc
          pnpm --filter @risk/desktop exec electron-builder --dir
      - name: Smoke-test packaged renderer origin
        run: xvfb-run -a pnpm verify:packaged-two-instances apps/desktop/release/linux-unpacked/risk

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format desktop backend
        run: cargo fmt --manifest-path desktop-backend/Cargo.toml --check
      - name: Desktop backend clippy
        run: cargo clippy --manifest-path desktop-backend/Cargo.toml --all-targets -- -D warnings
      - name: Desktop backend tests
        run: cargo test --manifest-path desktop-backend/Cargo.toml
      - name: Format TURN credential issuer
        run: cargo fmt --manifest-path server/Cargo.toml --check
      - name: TURN credential issuer clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: TURN credential issuer tests
        run: cargo test --manifest-path server/Cargo.toml

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Check desktop backend formatting
        run: cargo fmt --manifest-path desktop-backend/Cargo.toml --check
      - name: Check Windows-specific desktop backend code
        run: cargo clippy --manifest-path desktop-backend/Cargo.toml --all-targets -- -D warnings
      - name: Test desktop backend on Windows
        run: cargo test --manifest-path desktop-backend/Cargo.toml
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build Windows unpacked application
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key-for-ci-only
        run: |
          pnpm build:backend:desktop
          pnpm build:web
          pnpm --filter @risk/desktop exec tsc
          pnpm --filter @risk/desktop exec electron-builder --win dir
