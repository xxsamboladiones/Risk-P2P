# Produção: realm, segredo REST, IP externo e certificados são adicionados pelo
# entrypoint a uma cópia em tmpfs para não gravar nem expor segredos em argv.
listening-port=3478
tls-listening-port=5349
alt-tls-listening-port=443

fingerprint
use-auth-secret
stale-nonce=600
max-allocate-lifetime=3600

# Faixa de relay ampla. Em produção o container usa a rede do host para evitar
# milhares de regras de NAT do Docker.
min-port=49152
max-port=65535

# WebRTC usa allocations UDP mesmo quando cliente -> TURN trafega por TCP/TLS.
# Desabilitar RFC 6062 reduz a superfície sem remover TURN/TCP ou TURN/TLS.
no-tcp-relay
no-multicast-peers
no-software-attribute
cipher-list="HIGH:!aNULL:!MD5:!3DES"
unauthorized-ratelimit
unauthorized-ratelimit-rps=10
no-auth-pings
no-dynamic-ip-list
no-dynamic-realms

# Impede usar o relay para alcançar redes internas acessíveis pelo servidor.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
log-min-level=info
