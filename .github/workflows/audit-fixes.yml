name: Apply long-call stability fix

on:
  push:
    branches:
      - hotfix/group-invite-ack-stall

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Apply long-call stability patches
        run: |
          python scripts/apply-long-call-stability-fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/call.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace('Object.values(participant.streams).forEach', 'Object.values(participant.streams ?? {}).forEach')
          path.write_text(source, encoding='utf-8')
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - name: Commit validated long-call stability fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/services/supabase/signaling.ts packages/rtc/src/index.ts packages/rtc/src/index.test.ts apps/web/src/call.ts
          git commit -m "fix(call): stabilize long-running peer sessions"
          git push
