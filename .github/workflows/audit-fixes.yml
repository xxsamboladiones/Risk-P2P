name: Apply private chat and preview stability fix

on:
  push:
    branches:
      - hotfix/group-invite-ack-stall

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Patch stable conversation ownership
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path("apps/web/src/main.tsx")
          source = main.read_text(encoding="utf-8")
          expression = 'activeFriend ? privateChannelId : activeChannel?.kind === "text" ? activeChannel.id : null'

          pattern = re.compile(
              r'  useEffect\(\(\) => \{\n\s+const conversationId = activeFriend \? privateChannelId : activeChannel\?\.kind === "text" \? activeChannel\.id : null;\n\s+if \(!conversationId\) \{ setMessages\(\[\]\); setHasOlderMessages\(false\); setAttachments\(\[\]\); setAttachmentProgress\(\{\}\); return; \}'
          )
          replacement = (
              f'  const conversationId = {expression};\n\n'
              '  useEffect(() => {\n'
              '    if (!conversationId) { setMessages([]); setHasOlderMessages(false); setAttachments([]); setAttachmentProgress({}); return; }'
          )
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"conversation effect replacement count={count}")

          source, count = re.subn(
              r'  \}, \[activeChannel, activeFriend, privateChannelId\]\);',
              '  }, [conversationId]);',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"conversation dependency replacement count={count}")

          source, count = re.subn(
              r'  \}, \[activeFriend, currentUser\]\);',
              '  }, [activeFriend?.id, activeFriend?.local, currentUser?.displayName]);',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"private id dependency replacement count={count}")

          duplicate = f'    const conversationId = {expression};\n'
          if source.count(duplicate) != 2:
              raise SystemExit(f"conversation duplicate count={source.count(duplicate)}")
          source = source.replace(duplicate, '', 2)

          old = (
              '  const existing = current[index]!;\n'
              '  const replacement = attachmentStateWeight(record.state) >= attachmentStateWeight(existing.state) ? record : existing;\n'
              '  const next = [...current];\n'
              '  next[index] = replacement;'
          )
          new = (
              '  const existing = current[index]!;\n'
              '  const preferred = attachmentStateWeight(record.state) >= attachmentStateWeight(existing.state) ? record : existing;\n'
              '  const replacement: ChatAttachmentRecord = {\n'
              '    ...preferred,\n'
              '    sourcePersisted: preferred.sourcePersisted === true || existing.sourcePersisted === true || record.sourcePersisted === true,\n'
              '  };\n'
              '  const next = [...current];\n'
              '  next[index] = replacement;'
          )
          if old not in source:
              raise SystemExit("attachment dedupe anchor not found")
          main.write_text(source.replace(old, new, 1), encoding="utf-8")

          protocol = Path("packages/protocol/src/attachments.ts")
          source = protocol.read_text(encoding="utf-8")
          old = '  return MIME_BY_EXTENSION[extension] ?? normalized || "application/octet-stream";'
          new = '  return MIME_BY_EXTENSION[extension] ?? (normalized || "application/octet-stream");'
          if old not in source:
              raise SystemExit("MIME fallback anchor not found")
          protocol.write_text(source.replace(old, new, 1), encoding="utf-8")
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx packages/protocol/src/attachments.ts
          git commit -m "fix(chat): keep private P2P alive during calls"
          git push
