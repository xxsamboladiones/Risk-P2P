name: Repair Rust branch

on:
  push:
    branches:
      - fix/risk-stabilization

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/risk-stabilization
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix clippy range check and format Rust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/src/main.rs')
          text = path.read_text()
          old = "if length < 3 || length > 320 || !email.contains('@') || email.contains(char::is_whitespace) {"
          new = "if !(3..=320).contains(&length) || !email.contains('@') || email.contains(char::is_whitespace) {"
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --manifest-path server/Cargo.toml
      - name: Commit repair
        run: |
          if git diff --quiet -- server/src/main.rs; then
            echo "No Rust repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/main.rs
          git commit -m "style: aplica rustfmt e corrige clippy"
          git push origin HEAD:fix/risk-stabilization
