name: Apply persistent private chat session fix

on:
  push:
    branches:
      - hotfix/group-invite-ack-stall

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Keep private chat session alive across navigation
        shell: python
        run: |
          from pathlib import Path

          chat = Path("apps/web/src/chat.ts")
          source = chat.read_text(encoding="utf-8")

          old = '  private channelId?: string;\n  private groupId?: string;'
          new = '  private channelId?: string;\n  private targetChannelId?: string;\n  private groupId?: string;'
          if old not in source:
              raise SystemExit("chat target field anchor not found")
          source = source.replace(old, new, 1)

          old = '  history(channelId: string, options?: MessagePageOptions): Promise<LocalChatMessage[]> { return loadLocalMessages(channelId, options); }\n\n  async attachmentHistory'
          new = '  history(channelId: string, options?: MessagePageOptions): Promise<LocalChatMessage[]> { return loadLocalMessages(channelId, options); }\n\n  connectionSnapshot(): { channelId?: string; status: ChatConnectionStatus } {\n    return { channelId: this.targetChannelId ?? this.channelId, status: this.status };\n  }\n\n  async attachmentHistory'
          if old not in source:
              raise SystemExit("chat snapshot anchor not found")
          source = source.replace(old, new, 1)

          old = '    await this.disconnect();\n    this.setStatus("connecting");\n    const sessionToken = {};'
          new = '    await this.disconnect();\n    this.targetChannelId = channelId;\n    this.setStatus("connecting");\n    const sessionToken = {};'
          if old not in source:
              raise SystemExit("chat connect target anchor not found")
          source = source.replace(old, new, 1)

          old = '    this.attachmentService = undefined;\n    this.channelId = undefined;\n    this.groupId = undefined;'
          new = '    this.attachmentService = undefined;\n    this.channelId = undefined;\n    this.targetChannelId = undefined;\n    this.groupId = undefined;'
          if old not in source:
              raise SystemExit("chat disconnect target anchor not found")
          source = source.replace(old, new, 1)
          chat.write_text(source, encoding="utf-8")

          main = Path("apps/web/src/main.tsx")
          source = main.read_text(encoding="utf-8")

          old = '''  useEffect(() => {
    if (!conversationId) { setMessages([]); setHasOlderMessages(false); setAttachments([]); setAttachmentProgress({}); return; }
    let alive = true;
    const offMessage = chat.onMessage((message) => {
      if (!alive) return;'''
          new = '''  useEffect(() => {
    if (!conversationId) { setMessages([]); setHasOlderMessages(false); setAttachments([]); setAttachmentProgress({}); return; }
    const connection = chat.connectionSnapshot();
    if (connection.channelId && connection.channelId !== conversationId) {
      void chat.disconnect();
      setChatStatus("disconnected");
    } else {
      setChatStatus(connection.channelId === conversationId ? connection.status : "disconnected");
    }
    let alive = true;
    const offMessage = chat.onMessage((message) => {
      if (!alive || message.channelId !== conversationId) return;'''
          if old not in source:
              raise SystemExit("main conversation start anchor not found")
          source = source.replace(old, new, 1)

          old = '''    const offStatus = chat.onStatus((status) => {
      if (!alive) return;
      setChatStatus(status);
      if (status === "incompatible") setError(incompatiblePeerMessage());
    });'''
          new = '''    const offStatus = chat.onStatus((status) => {
      if (!alive) return;
      const current = chat.connectionSnapshot();
      const scopedStatus = current.channelId === conversationId ? status : "disconnected";
      setChatStatus(scopedStatus);
      if (scopedStatus === "incompatible") setError(incompatiblePeerMessage());
    });'''
          if old not in source:
              raise SystemExit("main scoped status anchor not found")
          source = source.replace(old, new, 1)

          old = '''      offAttachment();
      offProgress();
      void chat.disconnect();
      setChatStatus("disconnected");
      setAttachmentProgress({});'''
          new = '''      offAttachment();
      offProgress();
      setAttachmentProgress({});'''
          if old not in source:
              raise SystemExit("main cleanup anchor not found")
          source = source.replace(old, new, 1)
          main.write_text(source, encoding="utf-8")
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      - name: Commit validated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/chat.ts apps/web/src/main.tsx
          git commit -m "fix(chat): preserve private P2P session across navigation"
          git push
