services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: risk, POSTGRES_PASSWORD: risk_dev, POSTGRES_DB: risk }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U risk"], interval: 5s, timeout: 3s, retries: 10 }

  coturn:
    image: coturn/coturn:4.6-alpine
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes: ["./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro"]
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET:?Defina TURN_SECRET no arquivo .env}"]

  backend:
    image: rust:1.88-bookworm
    working_dir: /app/server
    command: cargo run
    volumes: [".:/app", "cargo_cache:/usr/local/cargo/registry"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://risk:risk_dev@postgres:5432/risk
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

volumes: { postgres_data: {}, cargo_cache: {} }
