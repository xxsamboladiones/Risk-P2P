services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: risk, POSTGRES_PASSWORD: risk_dev, POSTGRES_DB: risk }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U risk"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
  coturn:
    image: coturn/coturn:4.6-alpine
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    volumes: ["./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro"]
    command: ["-c", "/etc/coturn/turnserver.conf"]
  backend:
    image: rust:1.88-bookworm
    working_dir: /app/server
    command: cargo run
    volumes: [".:/app", "cargo_cache:/usr/local/cargo/registry"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://risk:risk_dev@postgres:5432/risk
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
volumes: { postgres_data: {}, redis_data: {}, cargo_cache: {} }
